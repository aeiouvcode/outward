<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-vUi9wE29zKy033UbhHbaS17IEK2HB4on2O8zrJKFy94='; style-src 'sha256-vwgwEv2ZH9ScqvyxV2UmLmv7Hz6t+AtZI0dDjm6EfRA='; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ECE6DC">
<title>Outward</title>
<style>
:root{--ground:#ECE6DC;--tray:#E3DBCE;--tile:#F8F4EC;--ink:#2B2723;--muted:#8C8378;--rust:#B4593A;--line:#D8CFC1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background:radial-gradient(120% 80% at 50% 0%,#F3EEE6 0%,var(--ground) 55%,#E5DDD0 100%)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}
header{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;height:48px}
.lvl{font:600 12px/1 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.lvl b{color:var(--ink);font-weight:600;letter-spacing:.08em;margin-left:6px}
.hearts{display:flex;gap:7px}
.heart{width:16px;height:16px;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.heart path{fill:var(--rust)}
.heart.lost path{fill:none;stroke:var(--line);stroke-width:2}
.heart.pop{transform:scale(1.35)}
.btn{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;cursor:pointer;padding:0}
.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative;transition:transform .15s,background .2s}
.icon:active{transform:scale(.92);background:rgba(0,0,0,.04)}
.icon svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon .n{position:absolute;right:3px;top:4px;font:600 10px/1 system-ui;color:var(--rust)}
.icon.off svg{stroke:var(--line)}
.right{display:flex;gap:2px}
main{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
#tray{position:relative;border-radius:22px;background:linear-gradient(180deg,#DDD4C6,var(--tray) 30%);box-shadow:inset 0 2px 5px rgba(70,50,30,.16),inset 0 -1px 0 rgba(255,255,255,.6),0 1px 0 rgba(255,255,255,.7)}
#board{position:absolute;inset:0}
.dot{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(120,100,80,.18);transform:translate(-50%,-50%)}
.t{position:absolute;border-radius:24%;background:linear-gradient(170deg,#FFFDF8 0%,var(--tile) 45%,#EFE8DC 100%);box-shadow:0 1px 0 #fff inset,0 -2px 0 rgba(160,140,115,.18) inset,0 2px 0 #D2C7B6,0 5px 10px rgba(70,50,25,.13);display:grid;place-items:center;cursor:pointer;will-change:transform,opacity;transition:box-shadow .12s}
.t svg{width:46%;height:46%;overflow:visible}
.t svg path{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.t.press{box-shadow:0 1px 0 #fff inset,0 -1px 0 rgba(160,140,115,.18) inset,0 1px 0 #D2C7B6,0 2px 4px rgba(70,50,25,.12)}
.t.hint::after{content:"";position:absolute;inset:-5px;border-radius:28%;border:2px solid var(--rust);animation:ring 1.1s ease-in-out infinite}
.t.hint svg path{stroke:var(--rust)}
.t.blocker{animation:tick .35s ease}
@keyframes ring{0%,100%{opacity:.25;transform:scale(.96)}50%{opacity:1;transform:scale(1.02)}}
@keyframes tick{30%{filter:brightness(.93)}}
.tip{min-height:42px;max-width:340px;text-align:center;color:var(--muted);font-size:14px;transition:opacity .4s}
.card{position:fixed;inset:0;display:grid;place-items:center;background:rgba(236,230,220,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s}
.card.on{opacity:1;pointer-events:auto}
.sheet{width:min(320px,86vw);padding:30px 26px 24px;border-radius:26px;background:var(--tile);box-shadow:0 1px 0 #fff inset,0 20px 50px rgba(70,50,25,.18),0 2px 0 #D2C7B6;text-align:center;transform:translateY(12px) scale(.98);transition:transform .45s cubic-bezier(.2,1.2,.4,1)}
.card.on .sheet{transform:none}
.sheet h2{margin:0 0 6px;font:500 30px/1.1 ui-serif,Georgia,"Times New Roman",serif;letter-spacing:-.01em}
.sheet p{margin:0 0 20px;color:var(--muted)}
.cta{display:block;width:100%;padding:14px;border-radius:16px;background:var(--ink);color:#F8F4EC;font-weight:600;letter-spacing:.02em;box-shadow:0 3px 0 #000,0 8px 16px rgba(0,0,0,.15);transition:transform .1s,box-shadow .1s}
.cta:active{transform:translateY(2px);box-shadow:0 1px 0 #000,0 3px 8px rgba(0,0,0,.15)}
.ghost{display:block;width:100%;margin-top:10px;padding:10px;color:var(--muted);font-size:14px}
.stars{display:flex;justify-content:center;gap:10px;margin:4px 0 18px}
.stars svg{width:22px;height:22px}
#title .sheet{background:transparent;box-shadow:none}
#title h1{margin:0;font:400 58px/1 ui-serif,Georgia,"Times New Roman",serif;letter-spacing:-.02em}
#title .sub{margin:12px 0 34px;color:var(--muted)}
.mark{display:flex;justify-content:center;gap:8px;margin-bottom:26px}
.mark span{width:34px;height:34px;border-radius:10px;background:linear-gradient(170deg,#FFFDF8,#EFE8DC);box-shadow:0 1px 0 #fff inset,0 2px 0 #D2C7B6,0 5px 10px rgba(70,50,25,.13);display:grid;place-items:center}
.mark span:last-child{animation:out 2.4s cubic-bezier(.5,0,.2,1) infinite}
.mark svg{width:16px;height:16px}.mark path{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@keyframes out{0%,35%{transform:none;opacity:1}70%{transform:translateX(60px);opacity:0}71%{transform:translateX(-10px);opacity:0}100%{transform:none;opacity:1}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="lvl">Level<b id="lvl">1</b></div>
    <div class="hearts" id="hearts"></div>
    <div class="right">
      <button class="btn icon" id="snd" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 9a4 4 0 0 1 0 6"/></svg></button>
      <button class="btn icon" id="hintBtn" aria-label="Hint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span class="n" id="hintN">3</span></button>
    </div>
  </header>
  <main>
    <div id="tray"><div id="board"></div></div>
    <div class="tip" id="tip"></div>
  </main>
</div>
<div class="card on" id="title"><div class="sheet">
  <div class="mark"><span><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></span><span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
  <h1>Outward</h1><div class="sub">Clear the way. One tile at a time.</div>
  <button class="btn cta" id="play">Play</button>
  <div class="ghost" id="cont"></div>
</div></div>
<div class="card" id="win"><div class="sheet"><h2 id="winH">Clear</h2><div class="stars" id="stars"></div><p id="winP"></p><button class="btn cta" id="next">Next level</button><button class="btn ghost" id="replay">Replay</button></div></div>
<div class="card" id="lose"><div class="sheet"><h2>Out of hearts</h2><p>The board resets. Look for the tile with nothing in front of it.</p><button class="btn cta" id="retry">Try again</button></div></div>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]]; // up right down left
const ARROW='<svg viewBox="0 0 24 24"><path d="M12 20V4M5.5 10.5L12 4l6.5 6.5"/></svg>';
const HEART='<svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.3-9.4C1.4 8 3.6 4.5 7.1 4.5c2 0 3.6 1.1 4.9 2.8 1.3-1.7 2.9-2.8 4.9-2.8 3.5 0 5.7 3.5 4.4 7.1C19.5 16.4 12 21 12 21z"/></svg>';
const STAR_ON='<svg viewBox="0 0 24 24"><path fill="#B4593A" d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.3L12 17l-5.6 3.2 1.3-6.3L3 9.6l6.3-.7z"/></svg>';
const STAR_OFF='<svg viewBox="0 0 24 24"><path fill="none" stroke="#D8CFC1" stroke-width="2" d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.3L12 17l-5.6 3.2 1.3-6.3L3 9.6l6.3-.7z"/></svg>';
const store={get(k,d){try{const v=localStorage.getItem("outward."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("outward."+k,JSON.stringify(v))}catch(e){}}};

// ---------- sound (all synthesized, soft) ----------
const Snd={ctx:null,out:null,on:store.get("sound",true),noise:null,
  init(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=this.ctx=new C();
    const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=5200;const comp=c.createDynamicsCompressor();comp.threshold.value=-22;comp.ratio.value=4;
    const g=this.out=c.createGain();g.gain.value=.55;g.connect(lp);lp.connect(comp);comp.connect(c.destination);
    const len=c.sampleRate*.6,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<len;i++){last=(last+.04*(Math.random()*2-1))/1.04;d[i]=last*3.2}this.noise=b;}catch(e){this.ctx=null}},
  ok(){if(!this.on||!this.ctx)return false;if(this.ctx.state==="suspended")this.ctx.resume();return true},
  whoosh(dist){if(!this.ok())return;const c=this.ctx,t=c.currentTime,s=c.createBufferSource();s.buffer=this.noise;const f=c.createBiquadFilter();f.type="bandpass";f.Q.value=1.1;
    const dur=.26+Math.min(dist,8)*.018;f.frequency.setValueAtTime(420,t);f.frequency.exponentialRampToValueAtTime(1900,t+dur*.55);f.frequency.exponentialRampToValueAtTime(900,t+dur);
    const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.04);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(this.out);s.start(t);s.stop(t+dur+.05);
    this.tone(260+Math.random()*30,.07,.035,"sine",t)},
  tone(fr,dur,vol,type,at){const c=this.ctx,t=at||c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.setValueAtTime(fr,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(this.out);o.start(t);o.stop(t+dur+.05)},
  bump(){if(!this.ok())return;const c=this.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(150,t+.09);o.frequency.exponentialRampToValueAtTime(62,t+.28);g.gain.setValueAtTime(0,t+.09);g.gain.linearRampToValueAtTime(.3,t+.1);g.gain.exponentialRampToValueAtTime(.001,t+.34);o.connect(g);g.connect(this.out);o.start(t+.09);o.stop(t+.4)},
  hint(){if(!this.ok())return;this.tone(784,.5,.05,"triangle");this.tone(1175,.6,.03,"sine",this.ctx.currentTime+.09)},
  tap(){if(!this.ok())return;this.tone(520,.05,.03,"triangle")},
  clear(){if(!this.ok())return;const t=this.ctx.currentTime;[392,494,587,784].forEach((f,i)=>this.tone(f,1.1,.06,"sine",t+i*.09));this.tone(196,1.4,.05,"triangle",t)}
};

// ---------- level generation (reverse construction = always solvable) ----------
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rayClear(grid,N,x,y,d){const[dx,dy]=DIRS[d];let cx=x+dx,cy=y+dy;while(cx>=0&&cy>=0&&cx<N&&cy<N){if(grid[cy*N+cx]>=0)return false;cx+=dx;cy+=dy}return true}
function firstBlock(grid,N,x,y,d){const[dx,dy]=DIRS[d];let cx=x+dx,cy=y+dy,k=1;while(cx>=0&&cy>=0&&cx<N&&cy<N){if(grid[cy*N+cx]>=0)return{x:cx,y:cy,k};cx+=dx;cy+=dy;k++}return null}
function spec(L){if(L===1)return{N:3,fill:0,fixed:[[1,1,0],[1,0,0],[0,1,1]]};
  const N=Math.min(8,4+Math.floor((L-2)/4));const fill=Math.min(.92,.62+((L-2)%4)*.07+Math.floor((L-2)/4)*.015);return{N,fill}}
function generate(L){const s=spec(L),N=s.N,grid=new Array(N*N).fill(-1);
  if(s.fixed){for(const[x,y,d] of s.fixed)grid[y*N+x]=d;return{N,grid}}
  const r=rng(L*7919+13),target=Math.round(N*N*s.fill);let placed=0,guard=0;
  while(placed<target&&guard++<N*N*4){const cands=[];
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(grid[y*N+x]>=0)continue;
      for(let d=0;d<4;d++){if(!rayClear(grid,N,x,y,d))continue;
        // score: how many placed tiles this new tile would block (depth of the puzzle)
        let sc=0;for(let dd=0;dd<4;dd++){const[dx,dy]=DIRS[dd];let cx=x-dx,cy=y-dy;while(cx>=0&&cy>=0&&cx<N&&cy<N){if(grid[cy*N+cx]===dd){sc++;break}if(grid[cy*N+cx]>=0)break;cx-=dx;cy-=dy}}
        cands.push({x,y,d,w:1+sc*2.2+r()*1.5})}}
    if(!cands.length)break;let tot=0;for(const c of cands)tot+=c.w*c.w;let p=r()*tot,pick=cands[0];for(const c of cands){p-=c.w*c.w;if(p<=0){pick=c;break}}
    grid[pick.y*N+pick.x]=pick.d;placed++}
  return{N,grid}}

// ---------- game state ----------
const S={L:1,N:3,grid:[],els:[],hearts:3,hints:3,busy:0,cell:0,done:false,moves:0,misses:0};
window.__outward=S;
const tray=$("tray"),board=$("board"),tip=$("tip");
function layout(){const vw=innerWidth,vh=innerHeight;const size=Math.floor(Math.min(vw-36,vh-190,560));tray.style.width=tray.style.height=size+"px";
  const pad=Math.max(10,size*.035);S.pad=pad;S.cell=(size-pad*2)/S.N;
  for(let y=0;y<S.N;y++)for(let x=0;x<S.N;x++){const e=S.els[y*S.N+x];if(e)place(e,x,y)}
  board.querySelectorAll(".dot").forEach(d=>{const x=+d.dataset.x,y=+d.dataset.y;d.style.left=S.pad+(x+.5)*S.cell+"px";d.style.top=S.pad+(y+.5)*S.cell+"px"})}
function place(e,x,y){const g=S.cell*.09;e.style.left=S.pad+x*S.cell+g+"px";e.style.top=S.pad+y*S.cell+g+"px";e.style.width=e.style.height=S.cell-g*2+"px"}
function renderHearts(){$("hearts").innerHTML=[0,1,2].map(i=>HEART).join("");[...$("hearts").children].forEach((h,i)=>h.classList.toggle("lost",i>=S.hearts))}
function tips(){if(S.L===1)return"Tap a tile whose path to the edge is clear.";if(S.L===2)return"A blocked tap costs a heart. Hold anywhere for a hint.";if(S.L===3)return"Plan the order. Every board can be cleared.";return""}
function load(L){S.L=L;const g=generate(L);S.N=g.N;S.grid=g.grid;S.hearts=3;S.hints=3;S.done=false;S.moves=0;S.misses=0;S.busy=0;
  board.innerHTML="";S.els=new Array(S.N*S.N).fill(null);$("lvl").textContent=L;$("hintN").textContent=S.hints;tip.textContent=tips();
  for(let y=0;y<S.N;y++)for(let x=0;x<S.N;x++){const dot=document.createElement("div");dot.className="dot";dot.dataset.x=x;dot.dataset.y=y;board.appendChild(dot)}
  for(let y=0;y<S.N;y++)for(let x=0;x<S.N;x++){const d=S.grid[y*S.N+x];if(d<0)continue;const e=document.createElement("div");e.className="t";e.innerHTML=ARROW;e.firstChild.style.transform="rotate("+d*90+"deg)";e.dataset.i=y*S.N+x;S.els[y*S.N+x]=e;board.appendChild(e)}
  layout();renderHearts();
  // entrance
  S.els.forEach((e,i)=>{if(!e)return;e.animate([{transform:"translateY(8px) scale(.9)",opacity:0},{transform:"none",opacity:1}],{duration:380,delay:(i%S.N+Math.floor(i/S.N))*28,easing:"cubic-bezier(.2,1.3,.4,1)",fill:"backwards"})});
  if(!S.preview)store.set("current",L);
  if(L===1)setTimeout(()=>{if(S.L===1&&S.moves===0)showHint(true)},1600)}
function removable(){const out=[];for(let i=0;i<S.grid.length;i++){const d=S.grid[i];if(d>=0&&rayClear(S.grid,S.N,i%S.N,Math.floor(i/S.N),d))out.push(i)}return out}
function clearHint(){board.querySelectorAll(".hint").forEach(e=>e.classList.remove("hint"))}
function showHint(free){if(S.done)return;clearHint();const r=removable();if(!r.length)return;
  if(!free){if(S.hints<=0){$("hintBtn").animate([{transform:"translateX(0)"},{transform:"translateX(-3px)"},{transform:"translateX(3px)"},{transform:"none"}],{duration:240});return}S.hints--;$("hintN").textContent=S.hints;$("hintBtn").classList.toggle("off",S.hints<=0)}
  // prefer the tile that frees the most others
  let best=r[0],bs=-1;for(const i of r){const d=S.grid[i];S.grid[i]=-1;const n=removable().length;S.grid[i]=d;if(n>bs){bs=n;best=i}}
  S.els[best].classList.add("hint");Snd.hint();if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}}
function tapTile(i){if(S.done||S.busy>2)return;const d=S.grid[i];if(d<0)return;const x=i%S.N,y=Math.floor(i/S.N),e=S.els[i];const[dx,dy]=DIRS[d];
  const blk=firstBlock(S.grid,S.N,x,y,d);
  if(!blk){clearHint();S.grid[i]=-1;S.els[i]=null;S.moves++;const dist=(dx>0?S.N-x:dx<0?x+1:dy>0?S.N-y:y+1);const far=(dist+1.5)*S.cell;
    Snd.whoosh(dist);S.busy++;e.style.pointerEvents="none";e.style.zIndex=5;
    const a=e.animate([{transform:"none",opacity:1},{transform:`translate(${-dx*S.cell*.08}px,${-dy*S.cell*.08}px) scale(.97)`,opacity:1,offset:.12},{transform:`translate(${dx*far}px,${dy*far}px)`,opacity:0}],{duration:300+dist*28,easing:"cubic-bezier(.55,0,.75,.4)",fill:"forwards"});
    a.onfinish=()=>{e.remove();S.busy--};
    if(!S.grid.some(v=>v>=0))setTimeout(win,420+dist*28);
    return}
  // blocked
  S.misses++;S.hearts--;Snd.bump();if(navigator.vibrate)try{navigator.vibrate([18,40,18])}catch(e){}
  const go=Math.max(0,blk.k-1)*S.cell+S.cell*.12;S.busy++;
  e.animate([{transform:"none"},{transform:`translate(${dx*go}px,${dy*go}px)`,offset:.4},{transform:`translate(${dx*(go-S.cell*.1)}px,${dy*(go-S.cell*.1)}px)`,offset:.55},{transform:"none"}],{duration:420+blk.k*40,easing:"cubic-bezier(.3,.7,.4,1)"}).onfinish=()=>S.busy--;
  const b=S.els[blk.y*S.N+blk.x];if(b){b.classList.remove("blocker");void b.offsetWidth;b.classList.add("blocker");b.animate([{transform:"none"},{transform:`translate(${dx*3}px,${dy*3}px)`},{transform:"none"}],{duration:200,delay:150+blk.k*30})}
  const hv=S.hearts;setTimeout(()=>{renderHearts();const h=$("hearts").children[hv];if(h){h.classList.add("pop");setTimeout(()=>h.classList.remove("pop"),300)}},170+blk.k*20);
  if(S.hearts<=0){S.done=true;setTimeout(()=>$("lose").classList.add("on"),650)}}
function win(){if(S.done)return;S.done=true;Snd.clear();const stars=S.hearts;$("stars").innerHTML=[0,1,2].map(i=>i<stars?STAR_ON:STAR_OFF).join("");
  const best=store.get("stars",{});best[S.L]=Math.max(best[S.L]||0,stars);store.set("stars",best);store.set("level",Math.max(S.L+1,store.get("level",1)));
  $("winH").textContent=stars===3?"Clean clear":"Clear";$("winP").textContent=S.misses?`${S.moves} tiles, ${S.misses} blocked`:`${S.moves} tiles, not one wasted tap`;
  setTimeout(()=>$("win").classList.add("on"),250)}

// ---------- input: tap vs long-press ----------
let press=null;
board.addEventListener("pointerdown",ev=>{Snd.init();const t=ev.target.closest(".t");press={x:ev.clientX,y:ev.clientY,t,long:false,timer:setTimeout(()=>{if(press){press.long=true;if(press.t)press.t.classList.remove("press");showHint(false)}},480)};if(t)t.classList.add("press")});
function endPress(ev,cancel){if(!press)return;clearTimeout(press.timer);const p=press;press=null;if(p.t)p.t.classList.remove("press");if(cancel||p.long||!p.t)return;if(Math.hypot(ev.clientX-p.x,ev.clientY-p.y)>14)return;tapTile(+p.t.dataset.i)}
board.addEventListener("pointerup",ev=>endPress(ev,false));board.addEventListener("pointercancel",ev=>endPress(ev,true));
board.addEventListener("pointermove",ev=>{if(press&&Math.hypot(ev.clientX-press.x,ev.clientY-press.y)>14){clearTimeout(press.timer);if(press.t)press.t.classList.remove("press")}});
board.addEventListener("contextmenu",e=>e.preventDefault());
$("hintBtn").onclick=()=>{Snd.init();showHint(false)};
const sndBtn=$("snd");const paintSnd=()=>sndBtn.classList.toggle("off",!Snd.on);paintSnd();
sndBtn.onclick=()=>{Snd.init();Snd.on=!Snd.on;store.set("sound",Snd.on);paintSnd();Snd.tap()};
$("next").onclick=()=>{S.preview=false;$("win").classList.remove("on");load(S.L+1)};
$("replay").onclick=()=>{$("win").classList.remove("on");load(S.L)};
$("retry").onclick=()=>{$("lose").classList.remove("on");load(S.L)};
const saved=store.get("current",1);if(saved>1)$("cont").textContent="Continues at level "+saved;
$("play").onclick=()=>{Snd.init();Snd.tap();$("title").classList.remove("on")};
addEventListener("keydown",e=>{if(e.key==="h"||e.key==="H")showHint(false);if(e.key==="m"||e.key==="M")sndBtn.onclick();if(e.key==="Enter"){for(const c of["title","win","lose"])if($(c).classList.contains("on")){$(c).querySelector(".cta").click();break}}});
addEventListener("resize",layout);
document.addEventListener("visibilitychange",()=>{if(Snd.ctx){document.hidden?Snd.ctx.suspend():Snd.on&&Snd.ctx.resume()}});
window.onerror=()=>true;
const q=new URLSearchParams(location.search);const ql=parseInt(q.get("level")||"",10);S.preview=ql>0;
load(ql>0?ql:saved);
if(q.has("skip"))$("title").classList.remove("on");
})();
</script>
</body>
</html>
