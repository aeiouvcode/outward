<style>

(()=>{

// ---------- sound: synthesized, soft ----------

// ---------- shapes (original silhouettes, implicit functions on u,v in [-1,1]) ----------

function spec(L){

 const q=pts.slice();q[q.length-1]=[bx,by];
 const stroke=(c,w)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);for(let i=1;i<q.length;i++)ctx.lineTo(q[i][0],q[i][1]);ctx.stroke()};
 const head=(c,grow)=>{const tx=last[0]+DX[d]*(ah+grow),ty=last[1]+DY[d]*(ah+grow),px=-DY[d],py=DX[d],b2x=last[0]-DX[d]*(ah*.25+grow*.4),b2y=last[1]-DY[d]*(ah*.25+grow*.4);
  ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(b2x+px*(aw+grow),b2y+py*(aw+grow));ctx.lineTo(b2x-px*(aw+grow),b2y-py*(aw+grow));ctx.closePath();ctx.fill()};
 if(wide){stroke("#FFFDF8",lw+Math.min(9,cell*.3));head("#FFFDF8",Math.min(4,cell*.12))}
 stroke(col,lw);head(col,0)}
function draw(){const G=S.G;if(!G)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cv.width,cv.height);
 if(S.grid){ctx.fillStyle="rgba(91,69,53,.16)";for(let i=0;i<G.C*G.R;i++)if(G.mask[i]){ctx.beginPath();ctx.arc(cx(i),cy(i),Math.max(1,cell*.06),0,7);ctx.fill()}}
 if(S.guide>=0&&G.sn[S.guide].alive){const s=G.sn[S.guide],h=s.cells[s.cells.length-1],b=blockerOf(G,S.guide);const len=b?b.k-.5:Math.max(G.C,G.R);ctx.setLineDash([cell*.25,cell*.22]);ctx.lineWidth=Math.max(1.2,cell*.08);ctx.strokeStyle=b?"#C0462F":"#3F93D6";ctx.beginPath();ctx.moveTo(cx(h),cy(h));ctx.lineTo(cx(h)+DX[s.dir]*len*cell,cy(h)+DY[s.dir]*len*cell);ctx.stroke();ctx.setLineDash([])}
 const now=performance.now();
 G.sn.forEach((s,i)=>{if(!s.alive||s.moving)return;const fl=S.flash.get(i);let col=s.red?"#C0462F":"#5B4535";if(fl&&now<fl)col="#9C7A5E";const off=s.bump?s.bump.off:0;drawSnake(s,off,i===S.hint?"#3F93D6":col,i===S.hint)});
 for(const a of S.anim)drawSnake(a.s,a.off,a.s.red?"#C0462F":"#5B4535",false)}
let raf=0;function loop(){raf=0;const now=performance.now();let busy=false;
 for(const a of S.anim){const t=Math.min(1,(now-a.t0)/a.dur);a.off=a.total*(t*t*(1.6-.6*t));if(t<1)busy=true;else a.fin=true}
 S.anim=S.anim.filter(a=>!a.fin);
 for(const s of S.G.sn){if(s.bump){const t=Math.min(1,(now-s.bump.t0)/s.bump.dur);const p=t<.45?Math.sin(t/.45*Math.PI/2):Math.cos((t-.45)/.55*Math.PI/2);s.bump.off=s.bump.dist*p;if(t>=1)s.bump=null;else busy=true}}
 for(const [k,v] of S.flash)if(now<v)busy=true;
 if(S.hint>=0)busy=true;draw();if(busy)raf=requestAnimationFrame(loop)}
const kick=()=>{if(!raf)raf=requestAnimationFrame(loop)};
function renderHearts(){$("hearts").innerHTML=Array.from({length:S.maxH},(_,i)=>i).map(i=>i<S.hearts?HEART:HEART.replace("<svg",'<svg class="lost"')).join("")}
function tips(){return S.L===1?"Tap an arrow with a clear path. It slides out along its own line.":S.L===2?"Blocked arrows cost a heart. Hold an arrow to see its path.":S.L===3?"Everything interlocks. Find the ones that are free first.":""}
function load(L){S.L=L;S.G=generate(L);S.maxH=L<10?3:L<30?4:5;S.hearts=S.maxH;S.hints=3;S.done=false;S.moves=0;S.misses=0;S.anim=[];S.hint=-1;S.guide=-1;S.flash.clear();
 $("lvl").textContent="Level "+L;$("hintN").textContent=S.hints;$("tip").textContent=tips();renderHearts();layout();if(!S.preview)store.set("current",L);
 if(L===1)setTimeout(()=>{if(S.L===1&&!S.moves)showHint(true)},1500)}
function removable(){const G=S.G,o=[];G.sn.forEach((s,i)=>{if(s.alive&&!s.moving&&!blockerOf(G,i))o.push(i)});return o}
S.removable=removable;
function showHint(free){if(S.done)return;const r=removable();if(!r.length)return;if(!free){if(S.hints<=0)return;S.hints--;$("hintN").textContent=S.hints;$("hintBtn").classList.toggle("off",S.hints<=0)}
 // prefer the arrow that frees the most others
 let best=r[0],bs=-1;const G=S.G;for(const i of r){const save=G.sn[i].cells.slice();save.forEach(c=>G.own[c]=-1);G.sn[i].alive=false;const n=removable().length;G.sn[i].alive=true;save.forEach(c=>G.own[c]=i);if(n>bs){bs=n;best=i}}
 S.hint=best;Snd.hint();kick()}
function tapArrow(i){const G=S.G,s=G.sn[i];if(S.done||!s||!s.alive||s.moving||s.bump)return;const b=blockerOf(G,i);
 if(!b){if(S.hint===i)S.hint=-1;if(S.guide===i)S.guide=-1;s.cells.forEach(c=>G.own[c]=-1);s.alive=false;s.moving=true;S.moves++;
  const h=s.cells[s.cells.length-1],x=h%G.C,y=(h/G.C)|0;const toEdge=s.dir===1?G.C-x:s.dir===3?x+1:s.dir===2?G.R-y:y+1;const total=toEdge+s.cells.length+1;
  S.anim.push({s,off:0,total,t0:performance.now(),dur:260+total*26});Snd.whoosh(s.cells.length);kick();
  if(!G.sn.some(q=>q.alive))setTimeout(win,300+total*26);return}
 S.misses++;S.hearts--;s.red=true;s.bump={off:0,dist:Math.max(0,b.k-1)+.35,t0:performance.now(),dur:380+b.k*30};S.flash.set(b.o,performance.now()+160+b.k*30+220);Snd.bump();
 if(navigator.vibrate)try{navigator.vibrate([16,40,16])}catch(e){}
 const hv=S.hearts;setTimeout(()=>{renderHearts();const el=$("hearts").children[hv];if(el){el.classList.add("pop");setTimeout(()=>el.classList.remove("pop"),300)}},150+b.k*25);kick();
 if(S.hearts<=0){S.done=true;setTimeout(()=>$("lose").classList.add("on"),700)}}
function win(){if(S.done)return;S.done=true;Snd.clear();const st=S.hearts>=S.maxH?3:S.hearts>=S.maxH-1?2:1;$("stars").innerHTML=[0,1,2].map(i=>STAR(i<st)).join("");const best=store.get("stars",{});best[S.L]=Math.max(best[S.L]||0,st);store.set("stars",best);
 $("winH").textContent=st===3?"Clean clear":"Clear";$("winP").textContent=S.misses?S.moves+" arrows, "+S.misses+" blocked":S.moves+" arrows, not one wasted tap";setTimeout(()=>$("win").classList.add("on"),250)}
function arrowAt(px,py){const G=S.G;const fx=(px-ox)/cell,fy=(py-oy)/cell;let best=-1,bd=.8;const x0=Math.floor(fx),y0=Math.floor(fy);
 for(let y=y0-1;y<=y0+1;y++)for(let x=x0-1;x<=x0+1;x++){if(x<0||y<0||x>=G.C||y>=G.R)continue;const o=G.own[y*G.C+x];if(o<0)continue;const d=Math.hypot(x+.5-fx,y+.5-fy);if(d<bd){bd=d;best=o}}return best}
S.cellCenter=i=>{const r=cv.getBoundingClientRect();return[r.left+cx(i),r.top+cy(i)]};
let press=null;
cv.addEventListener("pointerdown",e=>{Snd.init();const r=cv.getBoundingClientRect();const a=arrowAt(e.clientX-r.left,e.clientY-r.top);press={x:e.clientX,y:e.clientY,a,long:false,timer:setTimeout(()=>{if(press&&press.a>=0){press.long=true;S.guide=press.a;Snd.tick();kick()}},420)}});
function up(e,cancel){if(!press)return;clearTimeout(press.timer);const p=press;press=null;if(p.long){S.guide=-1;kick();return}if(cancel||p.a<0)return;if(Math.hypot(e.clientX-p.x,e.clientY-p.y)>16)return;tapArrow(p.a)}
cv.addEventListener("pointerup",e=>up(e,false));cv.addEventListener("pointercancel",e=>up(e,true));cv.addEventListener("pointerleave",e=>{if(press&&press.long)up(e,true)});
cv.addEventListener("contextmenu",e=>e.preventDefault());
$("hintBtn").onclick=()=>{Snd.init();showHint(false)};
$("gridBtn").onclick=()=>{S.grid=!S.grid;$("gridBtn").classList.toggle("on",S.grid);Snd.tick();kick()};
const sb=$("snd"),paint=()=>sb.classList.toggle("off",!Snd.on);paint();sb.onclick=()=>{Snd.init();Snd.on=!Snd.on;store.set("sound",Snd.on);paint();Snd.tick()};
$("menu").onclick=()=>{if(!S.done)load(S.L)};
$("next").onclick=()=>{S.preview=false;$("win").classList.remove("on");load(S.L+1)};
$("replay").onclick=()=>{$("win").classList.remove("on");load(S.L)};
$("retry").onclick=()=>{$("lose").classList.remove("on");load(S.L)};
$("play").onclick=()=>{Snd.init();Snd.tick();$("title").classList.remove("on")};
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(k==="h")showHint(false);if(k==="m")sb.onclick();if(k==="g")$("gridBtn").onclick();if(e.key==="Enter")for(const c of["title","win","lose"])if($(c).classList.contains("on")){$(c).querySelector(".cta").click();break}});
addEventListener("resize",layout);
document.addEventListener("visibilitychange",()=>{if(Snd.ctx){document.hidden?Snd.ctx.suspend():Snd.on&&Snd.ctx.resume()}});
window.onerror=()=>true;
// title logo: a small interlocked knot drawn in the game's own ink
(()=>{const c=$("logo"),d=Math.min(3,devicePixelRatio||1);c.width=120*d;c.height=120*d;const g=c.getContext("2d");g.scale(d,d);g.lineWidth=5;g.lineJoin="miter";
 const L=(pts,col)=>{g.strokeStyle=col;g.fillStyle=col;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(const p of pts.slice(1))g.lineTo(p[0],p[1]);g.stroke();const a=pts[pts.length-2],b=pts[pts.length-1],dx=Math.sign(b[0]-a[0]),dy=Math.sign(b[1]-a[1]);g.beginPath();g.moveTo(b[0]+dx*10,b[1]+dy*10);g.lineTo(b[0]-dy*8,b[1]+dx*8);g.lineTo(b[0]+dy*8,b[1]-dx*8);g.closePath();g.fill()};
 L([[20,100],[20,60],[60,60],[60,30]],"#C0462F");L([[40,20],[100,20],[100,100]],"#5B4535");L([[80,100],[40,100],[40,80],[80,80],[80,45]],"#5B4535")})();
const saved=store.get("current",1);if(saved>1)$("cont").textContent="Continues at level "+saved;
const q=new URLSearchParams(location.search),ql=parseInt(q.get("level")||"",10);S.preview=ql>0;
load(ql>0?ql:saved);if(q.has("skip"))$("title").classList.remove("on");
})();
